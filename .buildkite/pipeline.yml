# Buildkite CI (replaces .github/workflows/ci.yml now that this repo lives on Entire).
# Runs on Buildkite's free hosted Linux queue; checkout comes from the Entire plugin Buildkite adds to every job.
steps:
  - label: ":bun: typecheck + test"
    key: check
    agents:
      queue: linux-small
    timeout_in_minutes: 15
    plugins:
      - docker#v5.12.0:
          image: oven/bun:1.3.13
    command: bun install --frozen-lockfile && bun run check
