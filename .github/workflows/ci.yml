name: CI

# GitHub is a one-way mirror of the Entire repo (git mirror); this runs on every mirrored push. report.yml reports
# each run to the Entire trail, whose merge gate requires it.
on:
  push:
    branches-ignore: ['archive/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
          no-cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run typecheck and tests
        run: bun run check
      - name: Verify the T3 release pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run verify:t3-pin
